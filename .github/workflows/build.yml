name: Step-by-Step Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # مرحله ۱: دریافت کدها از ریپازیتوری
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # مرحله ۲: تنظیم نسخه جاوا
      - name: 2. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # مرحله ۳: نصب فلاتر
      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # مرحله ۴: تنظیم خودکار نسخه صحیح Gradle در سرور
      - name: 4. Force Valid Gradle Version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

      # مرحله ۵: بررسی سلامت محیط
      - name: 5. Check Flutter Environment
        run: flutter doctor -v

      # مرحله ۶: دریافت وابستگی‌های پروژه
      - name: 6. Get Dependencies
        run: flutter pub get

      # مرحله ۷: بررسی کدهای دارت
      - name: 7. Analyze Dart Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # مرحله ۸: رمزگشایی کلید امضا (Keystore)
      - name: 8. Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      # مرحله ۹: ساخت APK
      - name: 9. Build APK (Release)
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --build-name=1.0.0 \
            --build-number=$GITHUB_RUN_NUMBER

      # مرحله ۱۰: ساخت AAB (برای کافه بازار)
      - name: 10. Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --android-skip-build-dependency-validation \
            --build-name=1.0.0 \
            --build-number=$GITHUB_RUN_NUMBER

      # مرحله ۱۱: آپلود فایل APK
      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # مرحله ۱۲: آپلود فایل AAB
      - name: 12. Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab