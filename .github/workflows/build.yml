name: Step-by-Step Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # مرحله ۱: دریافت کدها از ریپازیتوری
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # مرحله ۲: تنظیم نسخه جاوا
      - name: 2. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # مرحله ۳: نصب فلاتر
      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # مرحله ۴: نمایش نسخه‌ها برای اطمینان از سلامت محیط
      - name: 4. Check Flutter Environment
        run: flutter doctor -v

      # مرحله ۵: دریافت پکیج‌های پروژه (pubspec.yaml)
      - name: 5. Get Dependencies
        run: flutter pub get

      # مرحله ۶: بررسی خطاهای سینتکس و کدهای دارت (از جمله main.dart)
      - name: 6. Analyze Dart Code & main.dart
        run: flutter analyze

      # مرحله ۷: رمزگشایی کلید امضا
      - name: 7. Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      # مرحله ۸: ساخت خروجی APK
      - name: 8. Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$GITHUB_RUN_NUMBER

      # مرحله ۹: ساخت خروجی AAB (برای کافه بازار)
      - name: 9. Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$GITHUB_RUN_NUMBER

      # مرحله ۱۰: آپلود فایل APK در گیت‌هاب
      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # مرحله ۱۱: آپلود فایل AAB در گیت‌هاب
      - name: 11. Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab