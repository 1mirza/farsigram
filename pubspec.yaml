name: farsi_shehshom_mirza
description: "بازی آموزشی فارسی ششم دبستان - شهرزاد"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # آیکون‌های استایل iOS
  cupertino_icons: ^1.0.6
  
  # برای انیمیشن‌های جذاب
  lottie: ^3.1.0
  
  # برای پشتیبانی کامل از راست‌چین (RTL) و زبان فارسی
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    # - assets/images/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf